<footer class="footer">
  <div class="footer__container">

    <div class="footer__col footer__col--about">
      <h3 class="footer__brand">{{ villageName }}</h3>
      <p class="footer__about">{{ about }}</p>
    </div>

    <div class="footer__col">
      <h4 class="footer__heading">Kontak Kami</h4>

      <ul class="footer__list">
        <li class="footer__item">
          <i class="fas fa-location-dot footer__icon"></i>
          <span>{{ address }}</span>
        </li>
        <li class="footer__item">
          <i class="fas fa-phone footer__icon"></i>
          <span>{{ phone }}</span>
        </li>
        <li class="footer__item">
          <i class="fas fa-envelope footer__icon"></i>
          <span>{{ email }}</span>
        </li>
      </ul>
    </div>

    <div class="footer__col">
      <h4 class="footer__heading">Social Media</h4>

      <div class="footer__socials">
        <a *ngFor="let social of socialLinks" [href]="social.url" class="footer__social-link" [attr.aria-label]="social.platform" target="_blank" rel="noopener noreferrer">
          <i *ngIf="social.platform === 'instagram'" class="fab fa-instagram"></i>
          <i *ngIf="social.platform === 'facebook'" class="fab fa-facebook"></i>
          <i *ngIf="social.platform === 'youtube'" class="fab fa-youtube"></i>
          <i *ngIf="social.platform === 'twitter'" class="fab fa-twitter"></i>
        </a>
      </div>
    </div>

  </div>

  <div class="footer__bottom">
    <p class="footer__copyright">{{ copyrightText }}</p>
  </div>
</footer>
