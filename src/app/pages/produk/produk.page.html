<div class="produk-page">

  <div class="produk__navbar-wrap">
    <app-navbar></app-navbar>
  </div>

  <section class="produk__banner">
    <h1 class="produk__banner-title">{{ bannerTitle }}</h1>

    <!-- Horizontal Filter Pills Slider -->
    <div class="produk__filter-slider-wrapper">
      <button
        type="button"
        class="produk__filter-arrow produk__filter-arrow--left"
        (click)="scrollFilterTrack('left')"
        aria-label="Geser filter ke kiri">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="produk__filter-pills-track" #filterTrack>
        <button
          type="button"
          class="produk__pill"
          [class.produk__pill--active]="!selectedTipeTanaman"
          (click)="clearFilters($event)">
          <i class="fa-solid fa-border-all produk__pill-icon"></i>
          <span class="produk__pill-label">Semua</span>
          <span class="produk__pill-badge">{{ getProdukCount(null) }}</span>
        </button>

        <button
          type="button"
          class="produk__pill"
          *ngFor="let option of tipeTanamanOptions"
          [class.produk__pill--active]="selectedTipeTanaman === option.key"
          (click)="toggleTipeTanaman(option.key, $event)">
          <i class="fa-solid produk__pill-icon" [ngClass]="option.icon"></i>
          <span class="produk__pill-label">{{ option.label }}</span>
          <span class="produk__pill-badge">{{ getProdukCount(option.key) }}</span>
        </button>
      </div>

      <button
        type="button"
        class="produk__filter-arrow produk__filter-arrow--right"
        (click)="scrollFilterTrack('right')"
        aria-label="Geser filter ke kanan">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </section>

  <main class="produk__content">

    <section class="produk__featured" *ngIf="isFeaturedVisible">
      <h2 class="produk__featured-title">{{ featured.title }}</h2>
      <p class="produk__featured-subtitle">{{ featured.subtitle }}</p>

      <div class="produk__featured-image-wrap">
        <img [src]="featured.image" [alt]="featured.title" class="produk__featured-image">
      </div>

      <a
        [routerLink]="featured.link"
        class="produk__featured-link"
        (click)="onLihatSelengkapnya(featured.title)">
        Lihat Selengkapnya &rarr;
      </a>
    </section>

    <section class="produk__grid">
      <a class="produk__card" *ngFor="let produk of filteredProdukList" [routerLink]="produk.link" (click)="onLihatSelengkapnya(produk.title)">
        <h3 class="produk__card-title">{{ produk.title }}</h3>

        <div class="produk__card-image-wrap">
          <img [src]="produk.image" [alt]="produk.title" class="produk__card-image">
        </div>

        <span class="produk__card-link">
          Lihat Selengkapnya &rarr;
        </span>
      </a>
    </section>

    <div class="produk__filter-results" *ngIf="selectedTipeTanaman">
      Menampilkan {{ filteredProdukList.length }} dari {{ produkList.length }} produk
    </div>

  </main>

</div>

<app-footer></app-footer>
