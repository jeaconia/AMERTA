<div class="produk-detail-page">
  <div class="produk-detail__navbar-wrap">
    <app-navbar></app-navbar>
  </div>

  <section class="produk-detail__hero">
    <div class="produk-detail__hero-content">
      <p class="produk-detail__eyebrow">Produk Unggulan</p>
      <h1 class="produk-detail__title">{{ detail.title }}</h1>
      <p class="produk-detail__subtitle">{{ detail.subtitle }}</p>
    </div>
  </section>

  <main class="produk-detail__content">
    <div class="produk-detail__image-wrap">
      <img [src]="detail.image" [alt]="detail.title" class="produk-detail__image">
    </div>

    <div class="produk-detail__body">
      <p class="produk-detail__description">{{ detail.description }}</p>

      <div class="produk-detail__highlights">
        <h2 class="produk-detail__highlights-title">Keunggulan</h2>
        <ul>
          <li *ngFor="let item of detail.highlights">{{ item }}</li>
        </ul>
      </div>

      <a routerLink="/produk" class="produk-detail__back-link">&larr; Lihat Produk Lainnya</a>
    </div>
  </main>
</div>

<app-footer></app-footer>
